name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # The extension shells out to `say` and `afplay`, so CI runs where it ships.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Type-checks src/ and then runs the MCP transport and TTS suites.
      - run: npm test
